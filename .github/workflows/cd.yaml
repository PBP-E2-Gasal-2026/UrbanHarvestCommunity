name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to PWS
        env:
          PWS_URL: ${{ secrets.PWS_URL }}

        run: |
          set -euo pipefail

          test -n "$PWS_URL" || {
            echo "PWS_URL secret is not configured."
            exit 1
          }

          git push "$PWS_URL" HEAD:master
