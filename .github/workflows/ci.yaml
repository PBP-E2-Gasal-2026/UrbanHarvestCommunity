name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ruff-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.2
      - name: Run ruff linter
        run: |
          ruff check . --exclude migrations

  css-build:
    # style.css adalah hasil build Tailwind yang di-commit. Kalau template berubah tapi CSS
    # tidak di-build ulang, class baru hilang dan tampilan rusak (mis. ikon SVG raksasa).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build CSS
        run: |
          npm ci
          npm run build:css
      - name: Pastikan style.css sudah di-build ulang
        run: |
          git diff --exit-code static/css/style.css || (echo "style.css belum di-build ulang. Jalankan: npm run build:css" && exit 1)

  run-tests:
    runs-on: ubuntu-latest
    env:
      PRODUCTION: "False"
      OPENROUTER_API_KEY: "ci-test-placeholder"
      LLM_RABBITMQ_URL: ""
      LLM_RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python manage.py test
