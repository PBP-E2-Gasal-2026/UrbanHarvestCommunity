name: CI

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - main

permissions:
  contents: read

jobs:
  check-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated styles are up to date
        run: |
          npm run build:css
          git diff --exit-code -- static/css/style.css

  ruff-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff linter
        run: |
          ruff check . --exclude migrations

  run-tests:
    runs-on: ubuntu-latest
    env:
      PRODUCTION: "False"
      OPENROUTER_API_KEY: "ci-test-placeholder"
      LLM_RABBITMQ_URL: ""
      LLM_RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python manage.py test
