{% if messages %}
  <div class="flex flex-col gap-2">
    {% for message in messages %}
      {% if message.tags == 'error' %}
        <p class="rounded-lg bg-danger-tint px-4 py-3 text-sm text-danger" role="alert">{{ message }}</p>
      {% elif message.tags == 'success' %}
        <p class="rounded-lg bg-brand-tint px-4 py-3 text-sm text-brand-soft" role="status">{{ message }}</p>
      {% else %}
        <p class="rounded-lg bg-glass px-4 py-3 text-sm text-body" role="status">{{ message }}</p>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
