{% load static %}
<footer class="relative bg-canvas text-white pt-24 overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-20">
        
        <div class="pb-16 max-w-2xl">
            <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl font-normal tracking-tight text-white leading-tight mb-8">
                Cultivating A Sustainable<br>Future Together
            </h2>

            <form class="flex items-center max-w-md bg-glass border border-glass-border rounded-pill p-1.5 focus-within:border-focus transition-all" onsubmit="event.preventDefault();">
                <div class="pl-4 pr-2 text-muted">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <input type="email" placeholder="Alamat Email Anda" aria-label="Alamat email" class="w-full bg-transparent text-xs sm:text-sm text-white placeholder:text-muted focus:outline-none px-2 py-1">
                <button type="submit" class="btn btn-primary btn-sm flex-shrink-0">
                    Berlangganan
                </button>
            </form>
        </div>

    </div>

    <div class="relative w-full h-[600px] sm:h-[750px] lg:h-[880px] -mt-24 sm:-mt-32 overflow-hidden pointer-events-none select-none">
        <img src="{% static 'images/footer.jpg' %}" alt="Urban Harvest Agriculture Field" class="w-full h-full object-cover object-bottom filter brightness-[0.7] contrast-[1.05]">

        <div class="absolute top-0 inset-x-0 h-96 bg-gradient-to-b from-canvas via-canvas/80 to-transparent"></div>
        
        <div class="absolute bottom-0 inset-x-0 h-40 bg-gradient-to-t from-canvas to-transparent"></div>

        <div class="absolute bottom-16 sm:bottom-24 inset-x-0 flex items-center justify-center">
            <span class="font-display text-6xl sm:text-8xl md:text-9xl lg:text-[13rem] font-semibold tracking-tight text-white/15 drop-shadow-2xl whitespace-nowrap">
                Urban Harvest
            </span>
        </div>
    </div>

</footer>
