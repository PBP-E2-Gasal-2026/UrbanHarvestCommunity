<header class="absolute top-0 left-0 right-0 z-50 pt-5 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Logo / Brand -->
        <a href="{% url 'main:show_main' %}" class="flex items-center gap-2.5 text-white group">
            <div class="w-8 h-8 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-emerald-400 group-hover:bg-white/20 transition-all">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L8 6h8l-4-4zM12 7L6 13h12l-6-6zM12 14l-8 7h16l-8-7z"/>
                </svg>
            </div>
            <span class="text-lg font-bold tracking-tight text-white drop-shadow-sm">Urban Harvest</span>
        </a>

        <!-- Center Floating Pill Nav (Desktop) -->
        <nav class="hidden md:flex items-center gap-1 bg-black/40 backdrop-blur-xl border border-white/15 px-2 py-1.5 rounded-full shadow-2xl">
            <a href="{% url 'main:show_main' %}" class="px-4 py-1.5 rounded-full text-xs font-semibold text-slate-900 bg-white shadow-sm transition-all">
                Beranda
            </a>
            <a href="#marketplace" class="px-4 py-1.5 rounded-full text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all">
                Marketplace
            </a>
            <a href="#forum" class="px-4 py-1.5 rounded-full text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all">
                Komunitas
            </a>
            <a href="#map" class="px-4 py-1.5 rounded-full text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all">
                Peta Kebun
            </a>
            <a href="#llm-search" class="px-4 py-1.5 rounded-full text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 transition-all flex items-center gap-1.5">
                <span>AI Search</span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            </a>
        </nav>

        <!-- Right CTA Button -->
        <div class="hidden md:flex items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-xs font-medium text-white/80">Halo, <strong class="text-white">{{ user.username }}</strong></span>
                <a href="{% url 'admin:logout' %}" class="inline-flex items-center justify-center px-4 py-2 text-xs font-semibold rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-md border border-white/20 transition-all">
                    Keluar
                </a>
            {% else %}
                <a href="#register" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-slate-900 bg-white hover:bg-slate-100 rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all">
                    <span>Gabung Komunitas</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 17L17 7M17 7H7M17 7V17"/>
                    </svg>
                </a>
            {% endif %}
        </div>

        <!-- Mobile Menu Hamburger -->
        <div class="flex md:hidden items-center">
            <button type="button" id="mobile-menu-btn" class="p-2 rounded-full bg-black/40 backdrop-blur-md border border-white/20 text-white">
                <svg class="w-5 h-5" id="menu-icon-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg class="w-5 h-5 hidden" id="menu-icon-close" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Dropdown -->
    <div class="hidden md:hidden mt-3 rounded-2xl bg-black/80 backdrop-blur-2xl border border-white/15 p-4 space-y-2 text-sm text-white" id="mobile-menu">
        <a href="{% url 'main:show_main' %}" class="block px-3 py-2 rounded-xl bg-white/10 font-medium">Beranda</a>
        <a href="#marketplace" class="block px-3 py-2 rounded-xl hover:bg-white/5 text-white/80">Marketplace</a>
        <a href="#forum" class="block px-3 py-2 rounded-xl hover:bg-white/5 text-white/80">Komunitas</a>
        <a href="#map" class="block px-3 py-2 rounded-xl hover:bg-white/5 text-white/80">Peta Kebun</a>
        <a href="#llm-search" class="block px-3 py-2 rounded-xl hover:bg-white/5 text-white/80">AI Search</a>
        <div class="pt-3 border-t border-white/10">
            {% if user.is_authenticated %}
                <a href="{% url 'admin:logout' %}" class="block w-full text-center px-4 py-2 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">Keluar</a>
            {% else %}
                <a href="#register" class="block w-full text-center px-4 py-2.5 text-xs font-semibold rounded-full bg-white text-slate-900">Gabung Komunitas ↗</a>
            {% endif %}
        </div>
    </div>
</header>
