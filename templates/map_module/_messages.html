{% if messages %}
<div class="mb-6 space-y-2" role="status">
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <p class="rounded-2xl border border-danger-border bg-danger-tint px-4 py-3 text-sm text-danger">{{ message }}</p>
        {% else %}
            <p class="rounded-2xl border border-brand bg-brand-tint px-4 py-3 text-sm text-brand-soft">{{ message }}</p>
        {% endif %}
    {% endfor %}
</div>
{% endif %}
