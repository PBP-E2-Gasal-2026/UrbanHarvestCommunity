<div id="toast" role="status" aria-live="polite"
     class="pointer-events-none fixed bottom-6 left-1/2 z-[70] -translate-x-1/2 translate-y-4 rounded-full border border-white/10 bg-black/60 px-5 py-3 text-sm text-white opacity-0 shadow-2xl backdrop-blur-xl transition duration-300"></div>
<script>
  (function () {
    if (window.marketplaceCardsReady) return;
    window.marketplaceCardsReady = true;
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2400);
    }

    // Tambah ke keranjang tanpa pindah halaman.
    document.addEventListener('submit', async function (event) {
      const form = event.target.closest('[data-add-to-cart]');
      if (!form) return;
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'X-Requested-With': 'XMLHttpRequest' },
        });
        if (response.redirected || response.status === 403) {
          location.href = response.url;
          return;
        }
        const data = await response.json();
        showToast(data.message);
        if (data.ok) {
          document.querySelectorAll('[data-cart-count]').forEach(function (badge) {
            badge.textContent = data.count;
            badge.classList.remove('hidden');
          });
        }
      } catch (error) {
        form.submit();
      } finally {
        button.disabled = false;
      }
    });

    // Tombol panah untuk baris produk yang bisa digeser.
    document.addEventListener('click', function (event) {
      const arrow = event.target.closest('[data-scroll]');
      if (!arrow) return;
      const track = arrow.closest('section').querySelector('[data-track]');
      const max = track.scrollWidth - track.clientWidth;
      const target = Math.min(Math.max(track.scrollLeft + Number(arrow.dataset.scroll) * track.clientWidth * 0.9, 0), max);
      // Snap dimatikan sebentar agar animasi scroll tidak "ditarik balik" oleh scroll-snap.
      track.style.scrollSnapType = 'none';
      track.scrollTo({ left: target, behavior: 'smooth' });
      clearTimeout(track.snapTimer);
      track.snapTimer = setTimeout(() => (track.style.scrollSnapType = ''), 700);
    });
  })();
</script>
