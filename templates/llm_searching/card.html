<article class="card group flex h-full flex-col overflow-hidden p-0 transition hover:border-glass-border">
    <a data-product-link href="{{ product.url }}" class="flex h-full flex-col">
        <div class="aspect-[4/3] overflow-hidden bg-surface-2">
            <img data-product-image src="{{ product.image_url }}" alt="{{ product.name }}" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" {% if not product.image_url %}hidden{% endif %}>
        </div>
        <div class="flex flex-1 flex-col gap-1.5 p-5">
            <p data-product-category class="text-[11px] font-semibold tracking-[0.12em] text-brand-soft uppercase">{{ product.category.name }}</p>
            <h3 data-product-name class="text-lg font-semibold tracking-tight text-white">{{ product.name }}</h3>
            <p data-product-price class="font-medium text-white/90">Rp{{ product.price }}/{{ product.unit }}</p>
            <p class="mt-auto pt-2 text-xs text-muted"><span data-product-location>{{ product.location }}</span> · <span data-product-stock>Stok: {{ product.stock }}</span></p>
        </div>
    </a>
</article>
