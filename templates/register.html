{% block title %}Daftar | Urban Harvest Community{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 pt-32 pb-16">
  <h1 class="mb-6 text-3xl font-bold">Daftar</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-rose-300" role="alert">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="rounded bg-emerald-600 px-4 py-2">Daftar</button>
  </form>
  <p class="mt-4">Sudah punya akun? <a href="{% url 'authentication:login' %}">Masuk</a></p>
</section>
{% endblock %}
